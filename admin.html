<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acesso admin · Núcleo Estrela Bonita</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#451b0a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fcf4ea'/%3E%3Cpath fill='%23451b0a' d='M32 6.5l1.9 3.9 4.3.6-3.1 3 .7 4.3-3.8-2-3.8 2 .7-4.3-3.1-3 4.3-.6z'/%3E%3Cg fill='none' stroke='%23451b0a' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 33 L32 25 L55 33'/%3E%3Cpath d='M5 36.5 H59'/%3E%3Cpath d='M8 36.5 V50 M56 36.5 V50 M15 36.5 V50 M49 36.5 V50'/%3E%3Cpath d='M28.5 50 V44 a3.5 3.5 0 0 1 7 0 V50'/%3E%3Cpath d='M20.5 50 V45.5 a2.5 2.5 0 0 1 5 0 V50'/%3E%3Cpath d='M38.5 50 V45.5 a2.5 2.5 0 0 1 5 0 V50'/%3E%3Cpath d='M4 51.5 H60'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ouro:#f4b41e;--creme:#fcf4ea;--linho:#e8dbc6;--linho-2:#d6c3a3;--cafe:#451b0a;--cafe-2:#5a2a14;--tinta:#2e1206;--suave:#6b5a4b;--ok:#2f7a33;--ok-soft:#e6f2e2;--err:#b3261e;--err-soft:#fbe9e6}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:14.5px/1.5 Montserrat,system-ui,sans-serif;color:var(--tinta);background:var(--cafe);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(800px 500px at 50% 0%,#6b3216,rgba(107,50,22,0) 70%),var(--cafe)}
.login form{width:min(400px,100%);background:var(--creme);border-radius:26px;padding:36px 30px 30px;box-shadow:0 40px 90px -30px rgba(0,0,0,.6)}
@media (max-width:420px){.login form{padding:30px 22px 24px}}
.selo{width:54px;height:54px;border-radius:50% 50% 14px 14px;background:var(--ouro);color:var(--cafe);display:grid;place-items:center;margin-bottom:18px}
.selo .ico{width:24px;height:24px}
.login h1{font-size:26px;color:var(--cafe)}
.login p{color:var(--suave);margin:6px 0 22px}
.login label{display:grid;gap:6px;font-size:12.5px;font-weight:600;color:var(--cafe-2)}
.login input{height:50px;border:0;border-radius:14px;padding:0 16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--linho-2);font-size:16px}
.login input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--cafe)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:15px;border:0;border-radius:999px;background:var(--cafe);color:var(--creme);font-weight:600;font-size:14px;cursor:pointer;transition:background .2s}
.btn:hover{background:#6e3618}
.btn[disabled]{opacity:.6;pointer-events:none}
.giro{width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.msg{margin-top:12px;padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:600}
.msg.erro{background:var(--err-soft);color:var(--err)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg a{color:inherit}
.voltar{display:block;text-align:center;margin-top:16px;color:var(--suave);font-size:13px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cadeado" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
  <symbol id="i-planilha" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M4 9h16M4 14.5h16M10 9v11.5"/></symbol>
</svg>

<main class="login">
  <form data-form novalidate>
    <div class="selo"><svg class="ico"><use href="#i-cadeado"/></svg></div>
    <h1>Acesso admin</h1>
    <p>Digite a senha para baixar a planilha (Excel) com todos os pedidos da camiseta.</p>
    <label>Senha<input type="password" name="senha" autocomplete="current-password" required autofocus></label>
    <div class="msg" data-msg role="status" hidden></div>
    <button class="btn" type="submit" data-baixar><svg class="ico"><use href="#i-planilha"/></svg><span>Baixar planilha</span></button>
    <a class="voltar" href="/">Voltar para a loja</a>
  </form>
</main>

<script>
const form = document.querySelector("[data-form]");
const campo = form.elements.senha;
const msg = document.querySelector("[data-msg]");
const botao = document.querySelector("[data-baixar]");
const ROTULO = botao.innerHTML;
let link = null;

function aviso(texto, tipo) {
  msg.className = "msg " + tipo;
  msg.textContent = texto;
  msg.hidden = false;
}
function nomeDoArquivo(r) {
  const m = /filename="?([^";]+)"?/i.exec(r.headers.get("content-disposition") || "");
  return m ? m[1] : "pedidos-camiseta.xlsx";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!campo.value) { aviso("Digite a senha.", "erro"); campo.focus(); return; }
  msg.hidden = true;
  botao.disabled = true;
  botao.innerHTML = '<span class="giro"></span><span>Gerando a planilha…</span>';
  try {
    const r = await fetch("/api/admin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ senha: campo.value }),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || "Não foi possível gerar a planilha agora. Tente de novo.");
    }
    const arquivo = await r.blob();
    const nome = nomeDoArquivo(r);
    const total = Number(r.headers.get("x-pedidos") || 0);
    if (link) URL.revokeObjectURL(link);
    link = URL.createObjectURL(arquivo);
    const a = document.createElement("a");
    a.href = link; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    campo.value = "";
    const qtd = total === 1 ? "1 pedido" : `${total} pedidos`;
    aviso("", "ok");
    msg.append(`Planilha baixada (${qtd}). Se o download não começou, `);
    const de_novo = document.createElement("a");
    de_novo.href = link; de_novo.download = nome; de_novo.textContent = "clique aqui";
    msg.append(de_novo, ".");
  } catch (err) {
    aviso(err.message === "Failed to fetch" ? "Sem conexão. Confira a internet e tente de novo." : err.message, "erro");
    campo.select();
  } finally {
    botao.disabled = false;
    botao.innerHTML = ROTULO;
  }
});
</script>
</body>
</html>
